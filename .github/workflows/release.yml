name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Сборка на ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: tgwsproxy
            asset_name: tgwsproxy-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: tgwsproxy.exe
            asset_name: tgwsproxy-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: tgwsproxy
            asset_name: tgwsproxy-macos-x86_64

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Кэширование зависимостей (ускоряет сборку)
        uses: Swatinem/rust-cache@v2

      - name: Сборка релизной версии
        run: cargo build --release --target ${{ matrix.target }}

      - name: Переименование бинарного файла
        shell: bash
        run: |
          mkdir -p release_assets
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} release_assets/${{ matrix.asset_name }}

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release_assets/${{ matrix.asset_name }}

  release:
    name: Создание GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Скачивание всех собранных артефактов
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Публикация релиза с файлами
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}